version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: daily
    commit-message:
      include: scope
      prefix: build
    ignore:
      - dependency-name: "com.defenseunicorns:koci"
    groups:
      gradle:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      include: scope
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
